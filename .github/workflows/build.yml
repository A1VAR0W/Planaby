name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v6
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}
          restore-keys: |
            deriveddata-

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Planaby.xcodeproj \
            -scheme Planaby \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            CLANG_ENABLE_COMPILE_CACHE=YES \
            MARKETING_VERSION=0.1.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO

      - name: Save DerivedData cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}

      # SideStore re-firma el IPA, pero lee los entitlements (App Groups) de la firma existente.
      - name: Fake-sign with entitlements
        run: |
          APP=DerivedData/Build/Products/Release-iphoneos/Planaby.app
          ldid -SWidgets/PlanabyWidgets.entitlements "$APP/PlugIns/PlanabyWidgets.appex/PlanabyWidgets"
          ldid -SApp/Planaby.entitlements "$APP/Planaby"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Planaby.app Payload/
          zip -qry Planaby.ipa Payload

      # El servidor lee estos datos para generar la fuente de SideStore/LiveContainer.
      - name: Write build metadata
        run: |
          jq -n \
            --arg version "0.1.${{ github.run_number }}" \
            --argjson build ${{ github.run_number }} \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(git log -1 --pretty=%s)" \
            --arg commit "$GITHUB_SHA" \
            '{version: $version, build: $build, date: $date, notes: $notes, commit: $commit}' > metadata.json
          cat metadata.json

      - uses: actions/upload-artifact@v7
        with:
          name: Planaby-ipa
          path: Planaby.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Planaby build ${{ github.run_number }}
          prerelease: true
          files: |
            Planaby.ipa
            metadata.json
            distribution/icon.png
