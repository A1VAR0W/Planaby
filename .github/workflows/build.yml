name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: |
          xcodebuild -version
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Planaby.xcodeproj \
            -scheme Planaby \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # SideStore re-firma el IPA, pero lee los entitlements (App Groups) de la firma existente.
      - name: Fake-sign with entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/Planaby.app
          ldid -SApp/Planaby.entitlements "$APP/Planaby"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Planaby.app Payload/
          zip -qry Planaby.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Planaby-ipa
          path: Planaby.ipa

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Planaby build ${{ github.run_number }}
          prerelease: true
          files: Planaby.ipa
