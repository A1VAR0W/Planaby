name: Planaby
options:
  bundleIdPrefix: com.alvaro
  # La app está en español: fechas, días y meses también.
  developmentLanguage: es
  deploymentTarget:
    iOS: "26.0"
packages:
  # SDK oficial de Spotify (App Remote): controla la app de Spotify instalada.
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Planaby:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: PlanabyWidgets
      - package: SpotifyiOS
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Planaby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Vuelta desde Spotify (App Remote) y consultar si está instalada.
        # planaby://desk y planaby://inbox: widgets y Live Activity vuelven a Planaby.
        CFBundleURLTypes:
          - CFBundleURLName: com.alvaro.planaby.spotify
            CFBundleURLSchemes:
              - planaby-spotify
          - CFBundleURLName: com.alvaro.planaby
            CFBundleURLSchemes:
              - planaby
        LSApplicationQueriesSchemes:
          - spotify
        NSMicrophoneUsageDescription: Planaby usa el micrófono para que añadas tareas y citas dictándolas.
        NSSpeechRecognitionUsageDescription: Planaby convierte lo que dictas en texto para crear tareas y citas.
        NSCalendarsFullAccessUsageDescription: Planaby lee los calendarios que elijas para no colocar bloques encima de tus citas.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Planaby.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alvaro.planaby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaro.planaby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Widgets, Live Activity y control del Centro de Control: el segundo App ID.
  PlanabyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Planaby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PlanabyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alvaro.planaby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaro.planaby.widgets

  # Tests de la lógica pura (planificador, ICS, temporizador, pases, bloqueo y recomendaciones), sin app anfitriona.
  PlanabyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Planning/WorkloadPlanner.swift
      - Shared/Planning/ICSCalendar.swift
      - Shared/AppGroup.swift
      - Shared/Models/FocusMethod.swift
      - Shared/TimerEngine/TimerState.swift
      - Shared/Engine/PassBook.swift
      - Shared/Engine/FrictionPolicy.swift
      - Shared/Engine/AttentionEngine.swift
      - Shared/Engine/TriageRules.swift
      - Shared/Models/MessageItem.swift
      - Shared/Engine/CommApps.swift
      - Shared/Engine/CommPolicy.swift
      - Shared/Engine/DeskLaunch.swift
      - Shared/Engine/DeskPresentation.swift
      - Shared/Planning/AgendaSnapshot.swift
      - Shared/Models/PlanModels.swift
      - Shared/Models/CapturedTask.swift
      - Shared/Engine/QuickCapture.swift
      - Shared/Planning/PlanDraft.swift
      - Shared/Planning/ProposalEditing.swift
      - Shared/Planning/PlanRequest.swift
      - Shared/Design/MotionTiming.swift
      - Shared/Engine/VolumeLevel.swift
      - Shared/Engine/AlertPreferences.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaro.planaby.tests

schemes:
  PlanabyTests:
    build:
      targets:
        PlanabyTests: [test]
    test:
      targets:
        - PlanabyTests
