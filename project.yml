name: Planaby
options:
  bundleIdPrefix: com.alvaro
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Planaby:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: PlanabyWidgets
    scheme: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Planaby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCalendarsFullAccessUsageDescription: Planaby lee los calendarios que elijas para no colocar bloques encima de tus citas.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Planaby.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alvaro.planaby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaro.planaby
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Widgets, Live Activity y control del Centro de Control: el segundo App ID.
  PlanabyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Planaby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PlanabyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alvaro.planaby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaro.planaby.widgets

  # Tests del planificador y del lector ICS: lógica pura, sin app anfitriona.
  PlanabyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared/Planning/WorkloadPlanner.swift
      - Shared/Planning/ICSCalendar.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alvaro.planaby.tests

schemes:
  PlanabyTests:
    build:
      targets:
        PlanabyTests: [test]
    test:
      targets:
        - PlanabyTests
